<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EstateArg — карта объектов (Буэнос-Айрес)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <header class="sidebar-header">
        <div class="header-row">
          <h1>EstateArg</h1>
          <div class="lang-switch" id="lang-switch">
            <button type="button" data-lang="ru" class="lang-btn active">RU</button>
            <button type="button" data-lang="en" class="lang-btn">EN</button>
          </div>
        </div>
        <p class="subtitle" id="label-subtitle">Карта объектов — Буэнос-Айрес</p>
      </header>

      <div class="filter-group">
        <label class="filter-label" id="label-type">Тип</label>
        <div class="chip-row" id="filter-type"></div>
      </div>

      <div class="filter-group">
        <label class="filter-label" id="label-district">Район</label>
        <select id="filter-district">
          <option value="" id="option-all-districts">Все районы</option>
        </select>
      </div>

      <div class="filter-group">
        <label class="filter-label" id="label-price">Цена, USD</label>
        <div class="price-range">
          <input type="number" id="price-min" placeholder="от" min="0" />
          <span>—</span>
          <input type="number" id="price-max" placeholder="до" min="0" />
        </div>
      </div>

      <div class="filter-group">
        <label class="filter-label" id="label-amenities">Удобства</label>
        <div class="chip-row" id="filter-amenities"></div>
      </div>

      <div class="filter-group">
        <button id="reset-filters" class="btn-reset">Сбросить фильтры</button>
      </div>

      <div class="filter-group results-count">
        <span id="label-shown">Показано:</span> <span id="results-count">0</span> <span id="label-of">из</span> <span id="total-count">0</span>
      </div>

      <footer class="sidebar-footer">
        <a href="https://t.me/EstateArg" target="_blank" rel="noopener" id="footer-link">@EstateArg в Telegram</a>
      </footer>
    </aside>

    <main id="map"></main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
